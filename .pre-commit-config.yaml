repos:
  # Hooks básicos para manter o repositório limpo
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Organização de imports (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Formatador de código padrão de mercado (Black)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  # Linter para checar erros de sintaxe e variáveis não usadas (Flake8)
  # O padrão do flake8 não cobra docstrings (isso exigiria o flake8-docstrings)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203"]
