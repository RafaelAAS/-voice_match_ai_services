version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: voicematch-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: voicematch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: voicematch-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ai-services
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin_password@db:5432/voicematch_db
      # URL para o backend chamar o microserviço de IA pela rede interna do Docker
      AI_SERVICES_URL: http://ai-services:8001
    volumes:
      - ./media/audio:/app/media/audio

  ai-services:
    # Ajuste o caminho abaixo conforme a organização real dos repositórios no disco.
    # Assume que voicematch-services é uma pasta irmã de voicematch-back:
    #   projetos/voicematch-back/docker-compose.yml
    #   projetos/voicematch-services/Dockerfile
    build: ../voicematch-services
    container_name: voicematch-ai-services
    restart: always
    ports:
      - "8001:8001"
    environment:
      MOCK_AI: "false"
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      # MESMO volume de áudio do backend, montado no MESMO caminho (/app/media/audio),
      # para que audio_path (ex: "media/audio/teste.mp3") resolva igual nos dois containers.
      - ./media/audio:/app/media/audio

volumes:
  postgres_data:
    name: voicematch_pg_data
